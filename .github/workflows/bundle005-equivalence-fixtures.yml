name: Public Bundle 005 - Equivalence Fixtures

on:
  push:
    branches:
      - main
    paths:
      - "bundle005/**"
      - ".github/workflows/bundle005-equivalence-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-equivalence-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run Bundle 005
        run: python -I -B --check-hash-based-pycs always bundle005/test_bundle.py
